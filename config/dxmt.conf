# DXMT per-process options (DXMT_CONFIG_FILE in cxbottle.conf points here, copied to C:\macquestlink\dxmt.conf).
# Steam only offers HEVC streaming to SteamVR when the GPU reports NVIDIA's vendor ID.
[steam.exe]
dxgi.customVendorId = 10de
dxgi.customDeviceId = 2684

[vrserver.exe]
dxgi.customVendorId = 10de
dxgi.customDeviceId = 2684

[d3dprobe.exe]
dxgi.customVendorId = 10de
dxgi.customDeviceId = 2684
